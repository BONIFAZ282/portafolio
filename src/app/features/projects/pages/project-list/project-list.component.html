<section class="container section">
  <header class="head">
    <span class="eyebrow">{{ 'nav.projects' | translate }}</span>
    <h1 class="section-title">{{ 'projects.title' | translate }}</h1>
    <p class="subtitle">{{ 'projects.subtitle' | translate }}</p>
  </header>

  <!-- Filtro empresas / personales -->
  <div class="filters">
    <button
      *ngFor="let f of filters"
      class="filter-pill"
      [class.active]="filter() === f.key"
      (click)="setFilter(f.key)"
      type="button"
    >
      {{ f.label | translate }}
      <span class="count">{{ count(f.key) }}</span>
    </button>
  </div>

  <div class="grid" *ngIf="projects().length; else empty">
    <app-project-card
      *ngFor="let project of projects(); let i = index"
      [project]="project"
      appReveal
      [revealDelay]="i * 100"
    ></app-project-card>
  </div>

  <ng-template #empty>
    <p class="muted">{{ 'projects.empty' | translate }}</p>
  </ng-template>
</section>
